apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-swe.fullname" . }}-agent
  labels:
    {{- include "open-swe.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: {{ .Values.openSwe.service.type }}
  ports:
    - port: {{ .Values.openSwe.service.port }}
      targetPort: {{ .Values.openSwe.service.targetPort }}
      protocol: TCP
      name: {{ .Values.openSwe.service.name }}
  selector:
    {{- include "open-swe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
