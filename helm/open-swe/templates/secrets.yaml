apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-swe.fullname" . }}-secrets
  labels:
    {{- include "open-swe.labels" . | nindent 4 }}
type: Opaque
data:
  # LLM Provider API Keys
  {{- if .Values.secrets.anthropicApiKey }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.googleApiKey }}
  googleApiKey: {{ .Values.secrets.googleApiKey | b64enc | quote }}
  {{- end }}
  
  # LangSmith API Key
  {{- if .Values.secrets.langchainApiKey }}
  langchainApiKey: {{ .Values.secrets.langchainApiKey | b64enc | quote }}
  {{- end }}
  
  # Infrastructure
  {{- if .Values.secrets.daytonaApiKey }}
  daytonaApiKey: {{ .Values.secrets.daytonaApiKey | b64enc | quote }}
  {{- end }}
  
  # Tools
  {{- if .Values.secrets.firecrawlApiKey }}
  firecrawlApiKey: {{ .Values.secrets.firecrawlApiKey | b64enc | quote }}
  {{- end }}
  
  # GitHub App Secrets
  {{- if .Values.secrets.githubAppId }}
  githubAppId: {{ .Values.secrets.githubAppId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  githubAppPrivateKey: {{ .Values.secrets.githubAppPrivateKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppClientSecret }}
  githubAppClientSecret: {{ .Values.secrets.githubAppClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubWebhookSecret }}
  githubWebhookSecret: {{ .Values.secrets.githubWebhookSecret | b64enc | quote }}
  {{- end }}
  
  # Encryption
  {{- if .Values.secrets.secretsEncryptionKey }}
  secretsEncryptionKey: {{ .Values.secrets.secretsEncryptionKey | b64enc | quote }}
  {{- end }}
